name: quilt

services:
  postgres:
    image: postgres:18-alpine
    container_name: quilt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quilt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quilt}
      POSTGRES_DB: ${POSTGRES_DB:-quilt}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-quilt} -d ${POSTGRES_DB:-quilt}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
  mailpit:
    image: axllent/mailpit:v1
    container_name: quilt-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 500
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data:
    name: quilt_postgres_data
